name: November 15 public source full-cohort capture
on:
  push:
    branches:
      - research/2026-11-15-full-public-capture
permissions:
  contents: write
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/2026-11-15-full-public-capture
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Query 458 sources without account writes
        env:
          AUDIT_OUTPUT: evidence/2026-11-15/02-full-institutional-source-recheck
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -B monitoring/2026-11-13/01-full-institutional-recheck/collector.py
      - name: Reconcile matched source keys and retain provenance
        run: python -B monitoring/2026-11-15/02-full-institutional-source-recheck/reconcile.py
      - name: Upload source evidence
        uses: actions/upload-artifact@v4
        with:
          name: full-public-source-capture-2026-11-15
          path: |
            evidence/2026-11-15/02-full-institutional-source-recheck/
            monitoring/2026-11-15/02-full-institutional-source-recheck/
          retention-days: 14
      - name: Commit captured evidence to this branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add evidence/2026-11-15/02-full-institutional-source-recheck/ monitoring/2026-11-15/02-full-institutional-source-recheck/
          git diff --cached --check
          git commit -m 'evidence: full public source recapture, 458 requests'
          git push origin HEAD:refs/heads/research/2026-11-15-full-public-capture
