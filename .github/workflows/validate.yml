name: Validate research contract

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run advisory contract checker
        run: python tools/check.py --mode advisory
      - name: Strict contract validation (advisory)
        continue-on-error: true
        run: python tools/check.py --mode strict
      - name: Replay existing retained evidence (advisory)
        continue-on-error: true
        run: python tools/check_retained_all.py
      - name: Validate October 18 corrected public package (advisory)
        continue-on-error: true
        run: python -B tools/check_research_capture_20261018.py

      - name: Validate October 20 reconciled public package (advisory)
        continue-on-error: true
        run: python -B tools/check_research_recheck_20261020.py
      - name: Recheck retained Zenodo family arithmetic (advisory)
        continue-on-error: true
        run: python -B tools/check_zenodo_family_rollup.py

      - name: Verify October 24 local-history handoff transport (advisory)
        continue-on-error: true
        run: python -B tools/check_local_handoff_20261024.py
