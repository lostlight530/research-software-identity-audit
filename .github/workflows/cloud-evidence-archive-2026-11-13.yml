name: Archive one-shot November 13 evidence
on:
  pull_request:
    paths:
      - ".github/workflows/cloud-evidence-archive-2026-11-13.yml"
permissions:
  contents: write
  actions: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Recover corrected cloud run evidence
        uses: actions/download-artifact@v4
        with:
          name: institutional-retest-2026-11-13
          run-id: 43265914410
          github-token: ${{ github.token }}
          path: evidence/2026-11-13/01-full-institutional-recheck
      - name: Independently verify source ledger, privacy and artifact digests
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          folder=Path("evidence/2026-11-13/01-full-institutional-recheck")
          contents={x.name:x.read_bytes() for x in folder.iterdir() if x.is_file()}
          for line in contents["sha256-manifest.txt"].decode().splitlines():
              sha,name=line.split("  ",1)
              assert hashlib.sha256(contents[name]).hexdigest()==sha,name
          lines=contents["source-attempts.jsonl"].decode().splitlines()
          assert len(lines)==458
          for line in lines: assert json.loads(line)["started_at_utc"]
          summary=json.loads(contents["summary.json"])
          assert summary["surface_count"]==34 and summary["known_doi_inventory"]==102
          assert summary["new_prospective_cells"]==0 and summary["control_is_rs11"] is False
          for name,data in contents.items():
              raw=data.decode("utf-8")
              assert not re.search(r"gh[pousr]_[A-Za-z0-9]+|github_pat_[A-Za-z0-9_]+|Bearer\s+\S+|(?i:cookie:|set-cookie:|session_token)",raw),name
              assert not re.search(r"[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}",raw),name
          print("Validated 458 source rows, 34 surfaces, 102 DOI inventory, no account-session payloads")
          print("Ledger SHA256:",hashlib.sha256(contents["source-attempts.jsonl"]).hexdigest())
          PY
      - name: Generate dated evidence provenance and machine manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib,json
          root=Path(".")
          folder=Path("evidence/2026-11-13/01-full-institutional-recheck")
          (folder/"README.md").write_text("""# November 13 cloud source recheck evidence

          Public read-only diagnostics captured by GitHub Actions, corrected collector run [43265914410](https://github.com/lostlight530/research-software-identity-audit/actions/runs/43265914410)

          - Source: authenticated-to-GitHub-only GitHub Actions runner; all scholarly endpoints read without user account sessions
          - Scope: 34 established source surfaces, 102 known DOI identifiers, Zenodo versions, public GitHub repositories, Software Heritage and upstream public interactions
          - Record identity: source-attempts.jsonl stores bounded per-request URL, UTC start/end, HTTP/error, source SHA-256, byte length, and minimized selected fields
          - No original HTTP response bodies are archived in the repository; hashes alone do not allow independent historical byte replay
          - Source artefact lineage: [first cloud run 43265103686](https://github.com/lostlight530/research-software-identity-audit/actions/runs/43265103686) retained as original diagnostic; second cloud run is a corrective collector rerun, not an alteration of the first
          - All source API and UI results are exploratory/diagnostic only, never 60 preregistered prospective cells
          - Failed and incomplete accesses remain in the attempt ledger; HTML success and canonical DOI mismatch require semantic scrutiny

          This evidence directory contains public fields and source references, not credentials or private session state
          """.replace("\n          ","\n"),encoding="utf-8")
          files=[]
          for p in sorted(folder.iterdir()):
              if p.is_file():
                  files.append({"path":p.as_posix(),"bytes":p.stat().st_size,"sha256":hashlib.sha256(p.read_bytes()).hexdigest()})
          (folder/"artifact-manifest.json").write_text(json.dumps({"files":files,"scope":"Published minimized public diagnostic evidence; source snapshots not original HTTP payloads"},indent=2)+"\n",encoding="utf-8")
          PY
      - name: Commit evidence files to review branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add evidence/2026-11-13/01-full-institutional-recheck/
          git diff --cached --check
          git commit -m "Append corrected November 13 cloud source evidence and provenance"
          git push origin "HEAD:${{ github.head_ref }}"
